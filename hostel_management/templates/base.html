<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Hostel Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="bg-primary text-white p-3 vh-100" style="width:260px">
        <h4 class="text-center">🏫 Hostel System</h4>
        <hr>
        {% if request.user.role == 'admin' %}
        <a href="/" class="text-white d-block mb-2"><i class="fa fa-home"></i> Dashboard</a>
        <a href="/students/" class="text-white d-block mb-2">👨‍🎓 Students</a>
        <a href="/hostels/" class="text-white d-block mb-2">🏢 Hostels</a>
        <a href="/gatein/" class="text-white d-block mb-2">🚪 Gate In</a>
        <a href="/gatepass/" class="text-white d-block mb-2">📝 Gate Pass</a>
        <a href="/reports/" class="text-white d-block mb-2">📊 Reports</a>
        <a href="/logout/" class="text-white d-block mt-4">🚪 Logout</a>
        {% endif %}
        {% if request.user.role == 'watchman' %}
        <a href="/gatein/">🚪 Gate In</a>
        <a href="/gatepass/">📝 Gate Pass</a>
        <a href="/" class="text-white d-block mb-2"><i class="fa fa-home"></i> Dashboard</a>
        <a href="/logout/" class="text-white d-block mt-4">🚪 Logout</a>
    </div>

    <!-- Main Content -->
    <div class="p-4 w-100">
        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
