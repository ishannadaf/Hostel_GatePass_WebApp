<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Hostel Management{% endblock %}</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="bg-primary text-white p-3 vh-100" style="width:260px">
        <h4 class="text-center mb-4">🏫 Hostel System</h4>

        <a href="/dashboard/" class="text-white d-block mb-2 text-decoration-none">
            <i class="fa fa-home me-2"></i> Dashboard
        </a>

        {% if request.user.role == 'admin' %}
            <a href="/students/" class="text-white d-block mb-2 text-decoration-none">👨‍🎓 Students</a>
            <a href="/hostels/" class="text-white d-block mb-2 text-decoration-none">🏢 Hostels</a>
            <a href="/watchmen/" class="text-white d-block mb-2 text-decoration-none">👮 Watchmen</a>
            <a href="/reports/" class="text-white d-block mb-2 text-decoration-none">📊 Reports</a>
            <a href="/gatein/" class="text-white d-block mb-2 text-decoration-none">🚪 Gate In</a>
            <a href="/gatepass/" class="text-white d-block mb-2 text-decoration-none">📝 Gate Pass</a>
        {% endif %}

        {% if request.user.role == 'watchman' %}
            <a href="/gatein/" class="text-white d-block mb-2 text-decoration-none">🚪 Gate In</a>
            <a href="/gatepass/" class="text-white d-block mb-2 text-decoration-none">📝 Gate Pass</a>
        {% endif %}

        <hr class="text-white">

        <a href="/login/logout/" class="text-white d-block mt-3 text-decoration-none">
            🚪 Logout
        </a>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="p-4 w-100 bg-light" style="min-height:100vh">
        {% block content %}{% endblock %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
