{% extends 'base.html' %}
{% block title %}Hostels{% endblock %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h3>Hostels</h3>
    <a href="/hostels/add/" class="btn btn-primary">+ Add Hostel</a>
</div>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Name</th>
            <th>Capacity</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for h in hostels %}
        <tr>
            <td>{{ h.name }}</td>
            <td>{{ h.capacity }}</td>
            <td>
                <a href="/hostels/edit/{{ h.id }}/" class="btn btn-sm btn-warning">Edit</a>
                <a href="/hostels/delete/{{ h.id }}/" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
