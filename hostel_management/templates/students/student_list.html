{% extends 'base.html' %}
{% block title %}Students{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Students</h3>
    <a href="/students/add/" class="btn btn-primary">+ Add Student</a>
</div>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Hostel</th>
            <th>Room</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for s in students %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.roll_no }}</td>
            <td>{{ s.hostel_name }}</td>
            <td>{{ s.room_no }}</td>
            <td>
                <a href="/students/edit/{{ s.id }}/" class="btn btn-sm btn-warning">Edit</a>
                <a href="/students/delete/{{ s.id }}/" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
