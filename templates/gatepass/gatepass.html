{% extends 'base.html' %}
{% block title %}Gate Pass{% endblock %}

{% block content %}
<div class="card shadow p-4">
    <h4>📝 Gate Pass Entry</h4>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="row mt-3">
            <div class="col-md-6 mb-3">
                <label>Student Roll Number</label>
                <input class="form-control" name="roll_no" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Reason</label>
                <input class="form-control" name="reason" required>
            </div>
        </div>

        <button class="btn btn-danger">Allow Exit</button>
    </form>
</div>
{% endblock %}
