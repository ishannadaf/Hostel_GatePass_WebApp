<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | Hostel GatePass</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width:420px">
        <h3 class="text-center mb-3">🏫 Hostel Login</h3>
        <p class="text-center text-muted">Admin / Watchman Access</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100 mt-2">
                Login
            </button>
            <div class="text-center mt-3">
                <p class="mb-1">New here?</p>
                <a href="{% url 'admin_signup' %}" class="btn btn-outline-primary w-100">
                    Create Admin Account
                </a>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none">← Back to Home</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
