{% extends 'base.html' %}
{% block title %}Activity Logs{% endblock %}

{% block content %}
<h3>📜 Activity Logs</h3>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>User</th>
            <th>Action</th>
            <th>Date & Time</th>
        </tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.user.username }}</td>
            <td>{{ log.action }}</td>
            <td>{{ log.timestamp|date:"d-m-Y H:i" }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No logs found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
